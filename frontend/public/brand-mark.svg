<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="SynthView AI">
  <defs>
    <linearGradient id="sv-left" x1="18" y1="16" x2="66" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B4BFF" />
      <stop offset="1" stop-color="#1769E0" />
    </linearGradient>
    <linearGradient id="sv-right" x1="110" y1="16" x2="62" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46D6B4" />
      <stop offset="1" stop-color="#0872B9" />
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
    <!-- left hemisphere -->
    <path
      d="M60 20C40 12 22 22 20 40c-2 14 6 22 2 34-4 14 10 30 26 30 8 0 12-6 12-14"
      stroke="url(#sv-left)"
    />
    <path d="M60 20v82" stroke="url(#sv-left)" />
    <!-- right hemisphere -->
    <path
      d="M68 20c20-8 38 2 40 20 2 14-6 22-2 34 4 14-10 30-26 30-8 0-12-6-12-14"
      stroke="url(#sv-right)"
    />
    <path d="M68 20v82" stroke="url(#sv-right)" />

    <!-- circuit traces, left -->
    <path d="M60 44H42l-6-6" stroke="url(#sv-left)" />
    <path d="M60 66H40" stroke="url(#sv-left)" />
    <path d="M60 88H46l-6 8" stroke="url(#sv-left)" />

    <!-- circuit traces, right -->
    <path d="M68 34h18l6-6" stroke="url(#sv-right)" />
    <path d="M68 58h22" stroke="url(#sv-right)" />
    <path d="M68 82h16l8 8" stroke="url(#sv-right)" />
  </g>

  <!-- vertical centre line -->
  <path d="M64 14v100" stroke="url(#sv-left)" stroke-width="5" stroke-linecap="round" />

  <!-- nodes -->
  <g fill="#1769E0">
    <circle cx="36" cy="38" r="4" />
    <circle cx="40" cy="66" r="4" />
    <circle cx="40" cy="96" r="4" />
  </g>
  <g fill="#0872B9">
    <circle cx="92" cy="28" r="5" />
    <circle cx="90" cy="58" r="5" />
    <circle cx="92" cy="90" r="5" />
  </g>
