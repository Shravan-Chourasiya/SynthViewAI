# Render Blueprint — SynthView AI backend
#
# Where this file lives matters. There is no root package.json and no workspace
# manifest in this repo, so `backend/` and `frontend/` are two independent npm
# projects rather than a workspace monorepo. Render treats the directory
# containing the Blueprint as the service root, so placing it next to
# `backend/package.json` means `npm install` / `npm run build` resolve against
# the backend with no `rootDir` override needed.
#
# To use it: Render Dashboard -> New + -> Blueprint -> pick this repo ->
# Blueprint Path: `backend/render.yaml`.
#
# Why Render and not Vercel for the backend: the API owns a stateful Socket.IO
# server attached to the same HTTP server (backend/src/server.ts), which
# serverless functions cannot host. Backend -> Render, frontend -> Vercel is
# deliberate.
#
# The entry point is `backend/src/server.ts`, and it must stay inside `src/`:
# tsconfig.json compiles `src/**/*.ts` only, so an entry point living at the
# backend root would be excluded from `npm run build` and `npm run start` would
# look for a `dist/server.js` that was never emitted.

services:
  - type: web
    name: synthview-ai-backend
    runtime: node
    # Free plan spins down after ~15 minutes of inactivity, so the first request
    # after idle is slow and any live interview socket is dropped. Move to a paid
    # instance for anything beyond a demo.
    plan: free
    # backend/package.json already declares engines.node "^24.0.0", which Render
    # reads directly — no separate .node-version file is needed (and adding one
    # would duplicate the same fact in two places).
    #
    # `--include=dev` is deliberate and load-bearing, not a typo. Two separate
    # reasons the build needs devDependencies:
    #   1. `npm run build` is `tsc`, and TypeScript is a devDependency.
    #   2. The `postinstall` script rewrites node_modules/@types/pg/package.json,
    #      another devDependency — so a dev-stripped install fails before the
    #      build even starts.
    # npm omits devDependencies whenever it sees NODE_ENV=production, and this
    # file sets exactly that a few lines below. Render applies its own Node
    # `NODE_ENV=production` at runtime only, but a service-defined value is not
    # subject to that restriction — so the flag removes the dependency on which
    # phase actually wins.
    #
    # Render does NOT install dependencies for a custom build command: the
    # install has to be part of the command itself. A service whose Build Command
    # is plain `npm run build` — one created from the Dashboard, or a Blueprint
    # service that has not been synced since its Build Command was overridden —
    # therefore runs tsc against an empty node_modules. That does not surface as
    # "tsc: not found", because Render's native runtimes preinstall TypeScript
    # (see the tools table in the native-runtimes docs), so tsc really does run
    # and then dies on the first type library it cannot resolve. The entire
    # failure is a single line with no hint of the missing install:
    #
    #     error TS2688: Cannot find type definition file for 'node'.
    #
    # A Dashboard Build Command wins over this file and only follows it on a
    # Blueprint sync, so keep the two in sync. `scripts/verify-build-deps.mjs`
    # (wired up as `prebuild`) now fails with the actionable message instead.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    # `/health` is a flat 200 liveness response (backend/src/app.ts). The deeper
    # `/ready` probe pings Postgres and Redis and returns 503 when either is
    # unreachable, which is what you want to *monitor* — but gating deploys on it
    # means a transient Redis blip fails the rollout, so the deploy gate stays on
    # `/health`.
    healthCheckPath: /health
    #
    # Recommended, currently commented out on purpose: apply pending Drizzle
    # migrations before each deploy. Without it a schema change (like the
    # interview-reminder columns) reaches production un-migrated and the affected
    # queries fail at runtime with "column does not exist". prompt 3 scopes this
    # file to build/start/health config only, so this is left as an opt-in — see
    # the deployment report.
    #
    # preDeployCommand: npm run db:migrate
    #
    envVars:
      # ── App ───────────────────────────────────────────────────────────────────
      # Must be `production` in production. env.schema.ts defaults it to
      # `development`, which would enable the localhost CORS fallback and disable
      # the Secure cookie flag, so the default is deliberately overridden here.
      - key: NODE_ENV
        value: production
      # PORT is intentionally absent: Render injects its own PORT at runtime, and
      # backend/src/config/env.ts hands process.env straight to env.schema.ts
      # (`z.coerce.number().int().positive().default(4000)`), so the dynamic port
      # is picked up correctly with no override.
      # API_VERSION has no schema default (`z.string()`, required). It is a fixed
      # part of the API contract (mirrored as VITE_API_VERSION in the frontend)
      # rather than deployment-specific, so it is committed here instead of
      # prompting for it.
      - key: API_VERSION
        value: api/v1

      # ── Database ─────────────────────────────────────────────────────────────
      # Full connection string, e.g. from a Render Postgres instance's
      # "Internal Database URL".
      - key: POSTGRES_URI
        sync: false

      # ── Redis ────────────────────────────────────────────────────────────────
      # REDIS_URI is required by the schema (validated as a URL). REDIS_HOST /
      # REDIS_PORT / REDIS_PASSWORD are required *separately* because the rate
      # limiter builds its own ioredis client from the discrete fields rather than
      # parsing REDIS_URI — see backend/src/config/redis.init.ts. Set both forms.
      - key: REDIS_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      # REDIS_PORT is omitted: schema default 6379.
      - key: REDIS_PASSWORD
        sync: false

      # ── Auth / JWT ───────────────────────────────────────────────────────────
      # Must be 64-512 characters. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      # ── CORS / Cookies ───────────────────────────────────────────────────────
      # Comma-separated, no trailing slash. Must contain the deployed frontend's
      # exact origin, e.g. `https://your-app.vercel.app`. In production an empty
      # value is a hard startup failure by design (see constants/cors.ts).
      - key: CORS_ORIGIN
        sync: false
      # Only meaningful once the frontend and backend share one registrable
      # domain, e.g. `.example.com` for app.example.com + api.example.com.
      # Leave blank when they are on unrelated hosts (*.vercel.app +
      # *.onrender.com) — see the cookie findings in the deployment report.
      - key: COOKIE_DOMAIN
        sync: false

      # ── Email (Brevo SMTP relay) ─────────────────────────────────────────────
      # Every one of these is REQUIRED by env.schema.ts. Missing any of them
      # makes the process exit at boot with "Invalid environment variables",
      # because OTP email is part of the registration flow — and the transport is
      # verified at startup (see backend/src/services/mail.service.ts), so a
      # revoked SMTP key shows up as a loud boot log rather than as silently
      # undelivered OTPs.
      #
      # SMTP_HOST is the relay's hostname (smtp-relay.brevo.com).
      - key: SMTP_HOST
        sync: false
      # SMTP_PORT is omitted: schema default 587, i.e. STARTTLS. 465 (implicit
      # TLS) also works — the client picks implicit TLS for that port.
      - key: SMTP_USER
        sync: false
      # The SMTP key, never the Brevo account password.
      - key: SMTP_PASSWORD
        sync: false
      # Must be a sender (or on a domain) verified on the Brevo account, or the
      # relay rejects every message.
      - key: EMAIL_FROM
        sync: false
      # EMAIL_FROM_NAME is omitted: schema default "SynthView AI".

      # ── AI Providers ─────────────────────────────────────────────────────────
      # Optional by schema: with neither key set the AI module falls back to a
      # built-in stub that returns generic questions and flat evaluations, so the
      # app boots but the product's core feature is inert. Set at least one.
      - key: GROQ_API_KEY
        sync: false
      # GROQ_MODEL is omitted: schema default `llama-3.1-8b-instant`.
      - key: MISTRAL_API_KEY
        sync: false
      # MISTRAL_MODEL is omitted: schema default `mistral-small-latest`.
      # MISTRAL_EMBED_MODEL is omitted too: schema default `mistral-embed`. It is
      # a separate model family from MISTRAL_MODEL (embeddings vs chat) and is
      # only read by the semantic-retrieval path, so the default is correct here
      # and no dashboard entry is needed.
