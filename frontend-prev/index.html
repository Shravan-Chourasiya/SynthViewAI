<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynthView AI — An AI interview that adapts to you</title>
  <meta name="description"
    content="Practice realistic interviews with an AI interviewer that evaluates your answers, adapts the conversation, and challenges you based on how you actually perform." />
  <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />

  <!-- Fonts: replace next/font from the original project -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script>
    // No-flash theme bootstrap — identical logic to the Next.js root layout.
    ; (function () {
      try {
        var t = localStorage.getItem('synthview-theme')
        if (!t) {
          t = 'dark'
        }
        var r = document.documentElement
        r.classList.remove('light', 'dark')
        r.classList.add(t)
        r.style.colorScheme = t
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
